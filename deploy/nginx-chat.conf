# nginx site for the chatbot: https://chat.optimivas.com -> container on 127.0.0.1:8787
# Copy to /etc/nginx/sites-available/optimivas-chat, enable it, then run:
#   sudo certbot --nginx -d chat.optimivas.com
# (the DNS record for chat.optimivas.com must point at this server first)

server {
    listen 80;
    listen [::]:80;
    server_name chat.optimivas.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (not append): the app trusts the first address, so a visitor-supplied
        # X-Forwarded-For must not get through. If a CDN such as Cloudflare sits in front
        # of nginx, use its real-client-IP header instead.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Show answers as they are written instead of waiting for the whole reply.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
